[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex-agent-framework"
version = "0.1.0"
description = "Capability-aware agent orchestration and automation framework"
requires-python = ">=3.15.2"
license = "Apache-2.0"
dependencies = []

[project.scripts]
vortex = "vortex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
