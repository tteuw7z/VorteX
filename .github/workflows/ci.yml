name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
      - name: Install FFmpeg if needed
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: python -m pip install .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: vortex plan "compile APK Android"
  android-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python -m pip install .
      - name: Build, sign and reverify synthetic APK
        run: |
          vortex apk fixture "$RUNNER_TEMP/vortex-apk" --build-tools 35.0.0
          vortex apk verify "$RUNNER_TEMP/vortex-apk/vortex-fixture.apk" --build-tools 35.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: vortex-synthetic-apk
          path: ${{ runner.temp }}/vortex-apk/
          if-no-files-found: error
          retention-days: 7
