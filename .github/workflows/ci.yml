name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15.2'
      - name: Audit reachable Git history before build
        run: python scripts/audit_git_history.py
      - name: Install media tools if needed
        run: |
          packages=()
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            packages+=(ffmpeg)
          fi
          if ! command -v tesseract >/dev/null || ! tesseract --list-langs | grep -qx eng; then
            packages+=(tesseract-ocr tesseract-ocr-eng)
          fi
          if (( ${#packages[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
      - run: python -m pip install .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - name: Export live ChatGPT catalog
        run: python -m vortex.live_catalog "$GITHUB_SHA" > "$RUNNER_TEMP/catalog.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chatgpt-live-catalog
          path: ${{ runner.temp }}/catalog.json
          if-no-files-found: error
          retention-days: 7
      - name: Measure bilingual planning latency
        run: |
          python - <<'PY'
          from statistics import median
          from timeit import repeat
          from vortex.core import plan
          tasks = ("Legendar os vídeos do ZIP", "Add captions to videos from a ZIP")
          samples = repeat(lambda: [plan(task, agent_limit=2) for task in tasks], number=1000, repeat=5)
          print(f"Median planning latency per task (microseconds): {median(samples) * 500:.2f}")
          PY
      - name: Compare common planning tasks on same runner
        run: |
          baseline=314ac4a4b2ed68e3945ec33e0d9cfc406181ee2c
          git cat-file -e "$baseline^{commit}" || git fetch --no-tags origin "$baseline"
          mkdir "$RUNNER_TEMP/vortex-baseline"
          git archive "$baseline" | tar -x -C "$RUNNER_TEMP/vortex-baseline"
          python scripts/benchmark_planning.py "$RUNNER_TEMP/vortex-baseline" "$GITHUB_WORKSPACE"
      - name: Compare Spector preflight against phase 6.16
        run: |
          mkdir "$RUNNER_TEMP/vortex-preflight-baseline"
          git archive fe74039e2dc46656be63c71c129309aa5c33c0e2 | tar -x -C "$RUNNER_TEMP/vortex-preflight-baseline"
          python scripts/benchmark_spectors.py "$RUNNER_TEMP/vortex-preflight-baseline" "$GITHUB_WORKSPACE"
      - run: vortex plan "compile APK Android"
      - name: Validate native Motion UI in Chromium
        run: CHROME="$(command -v google-chrome || command -v chromium)" node scripts/check_motion_browser.mjs "$RUNNER_TEMP/vortex-motion-browser"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: vortex-motion-browser-evidence
          path: ${{ runner.temp }}/vortex-motion-browser/
          if-no-files-found: warn
          retention-days: 7
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15.2'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p test_core.py -v
      - run: python -m unittest discover -s tests -p test_engines.py -v
      - run: python -m unittest discover -s tests -p test_assistant.py -v
      - run: python -m unittest discover -s tests -p test_catalog_phase6.py -v
      - run: python -m unittest discover -s tests -p test_remote.py -v
      - run: python -m unittest discover -s tests -p test_security.py -v
      - run: python -m unittest discover -s tests -p test_discipline.py -v
      - run: python -m unittest discover -s tests -p test_development.py -v
      - run: python -m unittest discover -s tests -p test_spectors.py -v
      - run: python -m unittest discover -s tests -p test_conversation.py -v
      - run: python -m unittest discover -s tests -p test_live_catalog.py -v
      - run: python -m unittest discover -s tests -p test_motion_ui.py -v
      - run: python -m unittest discover -s tests -p test_archive.py -v
      - run: python -m unittest discover -s tests -p test_automation.py -v
  android-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15.2'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision pinned Android SDK
        run: |
          sdk="$RUNNER_TEMP/vortex-android-sdk"
          work="$RUNNER_TEMP/vortex-sdk-downloads"
          mkdir -p "$sdk/build-tools" "$sdk/platforms" "$work"
          cd "$work"
          curl --fail --silent --show-error --location --retry 3 --max-time 300 \
            https://dl.google.com/android/repository/build-tools_r35_linux.zip -o tools.zip
          curl --fail --silent --show-error --location --retry 3 --max-time 300 \
            https://dl.google.com/android/repository/platform-35_r02.zip -o platform.zip
          sha256sum --check <<'SUMS'
          bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88  tools.zip
          0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0  platform.zip
          SUMS
          unzip -q tools.zip -d "$sdk/build-tools"
          mv "$sdk/build-tools/android-15" "$sdk/build-tools/35.0.0"
          unzip -q platform.zip -d "$sdk/platforms"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - run: python -m pip install .
      - name: Build, sign and reverify synthetic APK
        run: |
          vortex apk fixture "$RUNNER_TEMP/vortex-apk" --build-tools 35.0.0
          vortex apk verify "$RUNNER_TEMP/vortex-apk/vortex-fixture.apk" --build-tools 35.0.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vortex-synthetic-apk
          path: ${{ runner.temp }}/vortex-apk/
          if-no-files-found: error
          retention-days: 7

  publish-chatgpt-catalog:
    needs: [tests, portable-core, android-fixture]
    if: github.event_name == 'push' && github.repository == 'tteuw7z/VorteX' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/phase-6/catalog-reconciliation')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: vortex-chatgpt-live
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chatgpt-live-catalog
          path: ${{ runner.temp }}/live-catalog
      - name: Validate data and publish immutable source reference
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/live-catalog/catalog.json"
          python - "$manifest" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          if p.is_symlink() or not p.is_file() or p.stat().st_size > 262144:
              raise SystemExit("Invalid catalog file")
          obj = json.loads(p.read_bytes())
          if (obj.get("schema") != 1 or obj.get("source_sha") != os.environ["SOURCE_SHA"]
              or not re.fullmatch("[0-9a-f]{40}", obj["source_sha"])
              or obj.get("execution") != "host_binding_required"
              or obj.get("delivery_authorized") is not False
              or not all(isinstance(obj.get(k), list) for k in ("skills", "agents", "commands"))):
              raise SystemExit("Invalid catalog data")
          PY
          work="$RUNNER_TEMP/live-publish"
          mkdir "$work"
          cd "$work"
          git init -q
          git remote add origin https://github.com/tteuw7z/VorteX.git
          git config user.name "VorteX CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Read history without running repository code; never publish an older source.
          git fetch --no-tags origin "$SOURCE_SHA"
          current=$(git ls-remote origin "$SOURCE_REF" | cut -f1)
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "Source branch advanced; not publishing a superseded run."
            exit 0
          fi
          existing=$(git ls-remote origin refs/heads/chatgpt-live | cut -f1)
          if [ -n "$existing" ]; then
            git fetch --no-tags origin refs/heads/chatgpt-live
            git switch -c chatgpt-live FETCH_HEAD
            old=$(python -c 'import json; print(json.load(open("catalog.json"))["source_sha"])')
            [[ "$old" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin "$old"
            if ! git merge-base --is-ancestor "$old" "$SOURCE_SHA"; then
              echo "Refusing a non-descendant source update."
              exit 0
            fi
          else
            git switch --orphan chatgpt-live
          fi
          cp "$manifest" catalog.json
          git add -- catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish validated catalog for $SOURCE_SHA"
          gh auth setup-git
          git push origin HEAD:refs/heads/chatgpt-live
